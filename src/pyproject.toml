[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocsi"
version = "0.1.0"
description = "Object-Centric Surveillance Intelligence — memory-driven MOT + human activity understanding"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Perception adapters (Phase 1): detector / Re-ID / pose.
perception = ["ultralytics>=8.1", "torch>=2.0", "torchvision>=0.15"]
# YAML config files.
yaml = ["pyyaml>=6.0"]
# Development / tests.
dev = ["pytest>=7.0", "pyyaml>=6.0"]
# NOTE: HOTA/MOTA/IDF1 metrics use TrackEval, installed from source — see README.

[project.scripts]
ocsi = "ocsi.cli:main"   # CLI is implemented in Phase 6

[tool.setuptools.packages.find]
where = ["."]
include = ["ocsi*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
